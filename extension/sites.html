<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CornMute – My sites</title>
<link rel="stylesheet" href="ui.css">
<style>
  main { max-width: 640px; margin: 40px auto; padding: 0 16px; display: grid; gap: 16px; }
  h1 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 24px; }
  form { display: flex; gap: 8px; }
  form button { flex: none; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: none; }
  #msg { min-height: 1.2em; font-size: 13px; }
  #msg.err { color: var(--danger); }
  details summary { cursor: pointer; font-weight: 600; }
  .builtin { columns: 2; font-size: 13px; margin-top: 10px; color: var(--muted); }
  .builtin div { break-inside: avoid; }
  h2 { font-size: 16px; margin: 0 0 8px; }
</style>
</head>
<body>
<main>
  <h1><img src="icons/icon48.png" alt="" width="36" height="36"> My sites</h1>
  <p class="muted-text" style="margin:0">CornMute mutes a tab the moment one of these sites starts loading. Subdomains count too: adding <b>example.com</b> also covers www.example.com and video.example.com.</p>

  <section class="card">
    <h2>Add a site</h2>
    <form id="addForm">
      <input type="text" id="domain" placeholder="example.com — or paste a full link" autocomplete="off" spellcheck="false">
      <button class="primary" type="submit">Add</button>
    </form>
    <div id="msg"></div>
  </section>

  <section class="card">
    <h2>Your sites <span id="customCount" class="muted-text"></span></h2>
    <ul id="custom"></ul>
    <p id="empty" class="muted-text" style="margin:0">No sites added yet.</p>
  </section>

  <section class="card">
    <details>
      <summary>Built-in list (<span id="builtinCount">0</span> adult / NSFW sites, always on)</summary>
      <div id="builtin" class="builtin"></div>
    </details>
  </section>
</main>
<script type="module" src="mysites.js"></script>
</body>
</html>
